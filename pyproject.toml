[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateproof-refund-control"
version = "0.1.0"
description = "Receipt verification and reconciliation reference implementation for StateProof"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<46",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
